<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FoundingOS</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #05060a; color: #f4f5f8; font: 16px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 420px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #a7abb8; margin: 0 0 24px; }
  button { background: #f4f5f8; color: #05060a; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>FoundingOS needs an internet connection. Check your connection and try again.</p>
  <button id="retry">Try again</button>
</main>
<script>
  const target = new URLSearchParams(location.search).get('retry') || 'https://www.foundingos.com/app'
  const go = () => { if (/^https:\/\/(www\.)?foundingos\.com\//.test(target)) location.href = target }
  document.getElementById('retry').addEventListener('click', go)
  window.addEventListener('online', go)
</script>
</body>
</html>
