name: Verify ecosystem invariants

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ is required for --experimental-strip-types (used below to run the real
          # tester-system test suite directly against the TypeScript sources, no build step).
          node-version: 22
      - run: node scripts/verify-topology.mjs
      - run: node scripts/verify-superdashboard-isolation.mjs
      - run: node scripts/verify-brand-assets.mjs
      - run: node scripts/verify-hydration-safety.mjs
      # Real logic-level regression suite (session tokens, credential/module/survey mapping,
      # brand AI engine, Quantum engine) — previously written but never wired into CI, so it
      # silently rotted as the real system grew (credentials, modules, and brands all
      # increased in count without these tests being re-run) until this session's audit.
      - run: npm run test:tester-system

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Real, whole-monorepo type safety gate across all 26 apps + shared packages — this
      # session's actual bugs (both hydration issues, several prop-signature mismatches) were
      # frequently caught this way during manual verification; this makes that automatic on
      # every push/PR instead of relying on someone remembering to run it by hand.
      - run: npm run typecheck
