name: Verify ecosystem invariants

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ is required for --experimental-strip-types (used below to run the real
          # tester-system test suite directly against the TypeScript sources, no build step).
          node-version: 22
      # test:tester-system runs via `node --import tsx`, a devDependency — install it before
      # any step needs it. This was previously masked because an earlier verify step always
      # failed first; fixing those exposed that `npm ci` was never actually run in this job.
      - run: npm ci
      - run: node scripts/verify-topology.mjs
      - run: node scripts/verify-superdashboard-isolation.mjs
      - run: node scripts/verify-brand-assets.mjs
      - run: node scripts/verify-hydration-safety.mjs
      # Real logic-level regression suite (session tokens, credential/module/survey mapping,
      # brand AI engine, Quantum engine) — previously written but never wired into CI, so it
      # silently rotted as the real system grew (credentials, modules, and brands all
      # increased in count without these tests being re-run) until this session's audit.
      - run: npm run test:tester-system

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Build-only local workspace deps first: core-operations/workforce/intelligence backends
      # import @founder-os/auth and @founder-os/bob by their built `dist/` exports (not source),
      # and each backend's own module resolution expects a generated Prisma client under
      # src/generated/prisma — both are intentionally gitignored build artifacts (see .gitignore),
      # so typecheck fails with "cannot find module" unless they're produced first, exactly as
      # each backend's own `build` script already does before `tsc`.
      - run: npm run build --workspace @founder-os/auth --workspace @founder-os/bob
      - run: npm run prisma:generate --workspace @founder-os/core-operations-backend --workspace @founder-os/core-workforce-backend --workspace @founder-os/core-intelligence-backend
      # Real, whole-monorepo type safety gate across all 26 apps + shared packages — this
      # session's actual bugs (both hydration issues, several prop-signature mismatches) were
      # frequently caught this way during manual verification; this makes that automatic on
      # every push/PR instead of relying on someone remembering to run it by hand.
      - run: npm run typecheck
